[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[tool.coverage.run]
source = ["."]
omit = [
    "test/*",
    "android/*",
    "ios/*",
    "web/*",
    "windows/*",
    "linux/*",
    "macos/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
